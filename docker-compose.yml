services:
  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    ports:
      - "8100:8100"
    environment:
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-secret-change-me}
      - CLIENT_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
      - AGENT_SERVICE_URL=http://agent-service:8100
      - MONGO_URI=${MONGO_URI:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      - agent-service
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=/api
    depends_on:
      - server
    restart: unless-stopped
